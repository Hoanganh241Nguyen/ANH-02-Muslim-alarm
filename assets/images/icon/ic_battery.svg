<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#13956d"/>
      <stop offset="55%" stop-color="#08684f"/>
      <stop offset="100%" stop-color="#034332"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b0"/>
      <stop offset="28%" stop-color="#ffd766"/>
      <stop offset="62%" stop-color="#e3a928"/>
      <stop offset="100%" stop-color="#9a5c05"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8cd"/>
      <stop offset="100%" stop-color="#d9a72f"/>
    </linearGradient>

    <linearGradient id="batteryFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1fbd88"/>
      <stop offset="55%" stop-color="#0c8f67"/>
      <stop offset="100%" stop-color="#087052"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#001b14" flood-opacity="0.42"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="islamic" width="72" height="72" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d8c65a" stroke-width="3" opacity="0.20">
        <path d="M36 4 L46 18 L64 18 L54 32 L60 50 L42 46 L36 62 L30 46 L12 50 L18 32 L8 18 L26 18 Z"/>
        <rect x="24" y="24" width="24" height="24" transform="rotate(45 36 36)"/>
      </g>
    </pattern>
  </defs>

  <!-- Outer gold medallion -->
  <circle cx="256" cy="256" r="230" fill="url(#gold)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="216" fill="#f7e8a0"/>
  <circle cx="256" cy="256" r="207" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#fceba4" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Islamic background pattern -->
  <circle cx="256" cy="256" r="188" fill="url(#islamic)" opacity="0.55"/>

  <!-- Battery cap -->
  <rect x="219" y="101" width="74" height="42" rx="12" fill="url(#goldSoft)" stroke="#a36509" stroke-width="3"/>

  <!-- Battery body -->
  <g filter="url(#shadow)">
    <rect x="170" y="128" width="172" height="276" rx="34" fill="url(#gold)" stroke="#9a5c05" stroke-width="3"/>
    <rect x="186" y="145" width="140" height="243" rx="24" fill="#f4e7aa"/>
    <rect x="196" y="156" width="120" height="221" rx="20" fill="url(#batteryFill)" stroke="#063f31" stroke-width="5"/>
    <path d="M214 170 H294" stroke="#7ee0bd" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Lightning bolt -->
  <path d="M270 193 L225 272 H255 L238 334 L292 247 H261 Z"
        fill="url(#goldSoft)" stroke="#fff4b0" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Decorative stars -->
  <g fill="url(#goldSoft)" filter="url(#softGlow)">
    <path d="M256 397 L264 417 L284 425 L264 433 L256 453 L248 433 L228 425 L248 417 Z"/>
    <path d="M153 367 L158 379 L170 384 L158 389 L153 401 L148 389 L136 384 L148 379 Z"/>
    <path d="M359 367 L364 379 L376 384 L364 389 L359 401 L354 389 L342 384 L354 379 Z"/>
    <path d="M200 399 L204 408 L213 412 L204 416 L200 425 L196 416 L187 412 L196 408 Z"/>
    <path d="M312 399 L316 408 L325 412 L316 416 L312 425 L308 416 L299 412 L308 408 Z"/>
  </g>
</svg>