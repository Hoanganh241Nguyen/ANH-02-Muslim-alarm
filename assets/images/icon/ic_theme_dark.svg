<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moonGrad" x1="34" y1="20" x2="86" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="58" cy="62" r="50" fill="url(#moonGlow)"/>

  <!-- crescent (clean lune: outer arc r38, inner concave arc r48) -->
  <path d="M58,24 A38,38 0 1 0 58,100 A48,48 0 0 1 58,24 Z" fill="url(#moonGrad)"/>

  <!-- sparkle stars -->
  <g fill="url(#starGrad)">
    <path d="M88,34 L90.4,41 L97.4,43.4 L90.4,45.8 L88,52.8 L85.6,45.8 L78.6,43.4 L85.6,41 Z"/>
    <path d="M92,66 L93.4,70 L97.4,71.4 L93.4,72.8 L92,76.8 L90.6,72.8 L86.6,71.4 L90.6,70 Z"/>
    <circle cx="80" cy="86" r="2.4"/>
  </g>
</svg>
