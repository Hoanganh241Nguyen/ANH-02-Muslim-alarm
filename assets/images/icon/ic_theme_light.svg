<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunDisc" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="sunRay" x1="60" y1="6" x2="60" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F7B733"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="60" cy="60" r="52" fill="url(#sunGlow)"/>

  <!-- rays -->
  <g fill="url(#sunRay)">
    <g>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(45 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(90 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(135 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(180 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(225 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(270 60 60)"/>
      <rect x="55.5" y="8" width="9" height="20" rx="4.5" transform="rotate(315 60 60)"/>
    </g>
  </g>

  <!-- disc -->
  <circle cx="60" cy="60" r="24" fill="url(#sunDisc)"/>
  <!-- top-left specular highlight -->
  <circle cx="51" cy="51" r="8" fill="#FFF7DE" fill-opacity="0.55"/>
</svg>
