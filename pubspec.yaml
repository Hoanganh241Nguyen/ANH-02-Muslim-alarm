name: h01_muslim_alarm
description: "H01 Muslim Alarm - Prayer Times, Qibla, Quran & Gamification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  provider: ^6.1.1
  get_it: ^7.6.4
  equatable: ^2.0.5

  # Giờ cầu nguyện & Vị trí (SCR-03, SCR-05)
  adhan: ^2.0.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Dữ liệu & Cache (SCR-03, SCR-07)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  dio: ^5.4.0

  # Audio & Quran (SCR-06A)
  just_audio: ^0.9.36
  audio_service: ^0.18.15

  # UI & Animations
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - lib/assets/json/
    - lib/assets/json/icon/
